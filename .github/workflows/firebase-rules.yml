name: Firebase — publicar regras do Firestore

on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a chave do Firebase
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Falta o segredo FIREBASE_SERVICE_ACCOUNT no repositório — regras NÃO publicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Publicar firestore.rules
        if: steps.key.outputs.ok == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm i --no-save firebase-admin@13
          node fb/deploy/rules.js firestore.rules
