const CDT=`<table class="ltab"><tr><th>Dificuldade</th><th>CD</th><th>Exemplo</th></tr><tr><td>Muito fácil</td><td>5</td><td>Subir numa escada de corda</td></tr><tr><td>Fácil</td><td>10</td><td>Pular um riacho estreito</td></tr><tr><td>Média</td><td>15</td><td>Arrombar uma fechadura comum</td></tr><tr><td>Difícil</td><td>20</td><td>Escalar um muro liso na chuva</td></tr><tr><td>Muito difícil</td><td>25</td><td>Convencer o rei a trair um aliado</td></tr><tr><td>Quase impossível</td><td>30</td><td>Nadar contra uma cachoeira</td></tr></table>`;
const tipBox=(t,h)=>`<div class="lbox ${t}"><b>${t==='app'?'📱 No Inkmind':t==='try'?'🧪 Experimente':t==='ex'?'💬 Exemplo':'💡 Dica'}</b>${h}</div>`;
const RULES_BASIC=[
 ['O que é um RPG de mesa','<p>É uma história contada em grupo. Cada jogador cria e interpreta <b>um personagem</b> — um guerreiro, uma maga, um ladino… O <b>mestre</b> descreve o mundo, interpreta todas as outras pessoas e criaturas e apresenta os desafios. Quando o resultado de uma ação é incerto, <b>os dados decidem</b>.</p><p>Não existe “ganhar” do jeito de um jogo de tabuleiro: o objetivo é viver uma boa aventura juntos. Vocês podem lutar contra monstros, resolver mistérios, negociar com reis ou simplesmente explorar.</p>'+tipBox('tip','<p>Uma sessão costuma durar de 2 a 4 horas. Várias sessões com a mesma história formam uma <b>campanha</b>; uma aventura que termina num dia só é chamada de <b>one-shot</b>.</p>')],
 ['Quem faz o quê','<p><b>Jogadores</b>: decidem o que seus personagens dizem e fazem. Você não precisa saber as regras de cor — basta dizer a intenção (“quero escalar a torre para ver se há guardas”) e o mestre diz se é preciso rolar algum dado.</p><p><b>Mestre</b>: narra o que os personagens percebem, interpreta os personagens do mundo (NPCs), decide quando pedir testes, controla os inimigos e mantém a história andando. O mestre é o juiz, mas não é adversário dos jogadores: ele quer que a aventura seja boa para todos.</p><p>O ciclo básico é sempre o mesmo:</p><ol><li>O mestre descreve a situação.</li><li>Os jogadores dizem o que fazem.</li><li>Se houver risco ou incerteza, alguém rola os dados.</li><li>O mestre narra o resultado — e o ciclo recomeça.</li></ol>'],
 ['A ficha do personagem','<p>A ficha reúne tudo o que seu personagem é e sabe fazer:</p><ul><li><b>Raça</b> (humano, elfo, anão…) — traços de nascença.</li><li><b>Classe</b> (guerreiro, mago, ladino, clérigo…) — o que ele aprendeu a fazer.</li><li><b>Atributos</b> — seis números que medem suas capacidades:<ul><li><b>FOR</b> Força: golpes, carregar peso, escalar.</li><li><b>DES</b> Destreza: agilidade, pontaria, furtividade, iniciativa.</li><li><b>CON</b> Constituição: resistência e Vida.</li><li><b>INT</b> Inteligência: raciocínio, conhecimento, magia arcana.</li><li><b>SAB</b> Sabedoria: percepção, intuição, magia divina.</li><li><b>CAR</b> Carisma: persuasão, liderança, enganação.</li></ul></li><li><b>Vida</b> (PV), <b>Mana</b> (PM), <b>Defesa</b> e <b>Deslocamento</b>.</li></ul><p>Cada atributo tem um <b>modificador</b>, que é o número que você soma nos dados:</p>'+MODT+tipBox('app','<p>No Inkmind o mestre monta a ficha e deixa classe, raça e valores prontos — você só escolhe e dá o nome. Os modificadores são calculados sozinhos.</p>')],
 ['Os dados','<p>O RPG usa vários dados. O nome é a letra <b>d</b> seguida do número de lados: <b>d4, d6, d8, d10, d12, d20</b> e o <b>d100</b> (porcentagem).</p><p>A escrita <b>2d6+3</b> quer dizer: role dois dados de seis lados, some os resultados e acrescente 3. <b>1d20−1</b> é um dado de vinte lados menos um.</p><ul><li><b>d20</b>: o dado principal, usado em testes e ataques.</li><li><b>d4 a d12</b>: geralmente dano e cura (uma adaga dá 1d4, uma espada longa 1d8, um machado grande 1d12).</li><li><b>d100</b>: tabelas aleatórias e alguns sistemas de terror.</li></ul>'+tipBox('app','<p>Use o botão 🎲 Teste na Tela de jogo ou a aba Dados. A animação aparece no meio do mapa para toda a mesa.</p>')],
 ['Testes: quando a sorte entra','<p>Quando você tenta algo com chance de dar errado, o mestre pede um <b>teste</b>:</p><p class="lbig">1d20 + modificador ≥ CD</p><p>A <b>CD</b> (Classe de Dificuldade) é o número que você precisa alcançar. Quanto mais difícil, maior.</p>'+CDT+'<p>Nem tudo precisa de teste: abrir uma porta destrancada simplesmente acontece. Testes são para quando há <b>risco e incerteza</b>.</p>'+tipBox('ex','<p><b>Mestre:</b> “O muro tem uns quatro metros e está úmido. Faça um teste de Força, CD 15.”<br><b>Jogadora:</b> rola 11 no d20, soma +3 de FOR = 14. “Ah, não!”<br><b>Mestre:</b> “Você chega quase no topo, mas a pedra solta e você escorrega. Dá para tentar de novo, mas os guardas podem ouvir.”</p>')],
 ['Vantagem e desvantagem','<p>Às vezes a situação ajuda ou atrapalha. Em vez de somar números, o mestre pode dizer:</p><ul><li><b>Vantagem</b>: role 2d20 e use o <b>maior</b> (você atacou um inimigo desprevenido, teve ajuda de um aliado…).</li><li><b>Desvantagem</b>: role 2d20 e use o <b>menor</b> (está no escuro, ferido, com pressa…).</li></ul><p>Vantagem e desvantagem não se acumulam: se tiver as duas, elas se anulam.</p>'+tipBox('app','<p>Quando o mestre usa 🎯 Pedir teste com vantagem ou desvantagem, o app rola os 2d20 e escolhe sozinho. Condições como Envenenado ou Invisível também aplicam isso automaticamente.</p>')],
 ['Combate passo a passo','<ol><li><b>Iniciativa</b>: todos rolam 1d20 + DES. A ordem vai do maior para o menor.</li><li><b>Turnos</b>: na sua vez você pode <b>mover-se</b> até o seu deslocamento (9 m = 6 quadrados) e fazer <b>uma ação</b>. Falar é livre.</li><li>Quando todos agem, termina a <b>rodada</b> (cerca de 6 segundos no mundo do jogo) e começa outra.</li></ol><p><b>Ações comuns</b>: Atacar · Lançar uma magia · Usar um item (beber uma poção) · Disparar (correr o dobro) · Esquivar (inimigos têm desvantagem contra você) · Ajudar um aliado · Esconder-se.</p><p><b>Ataque</b>: role 1d20 + atributo da arma (FOR para espadas, DES para arcos e adagas) + proficiência (+2 no início). Se o total for igual ou maior que a <b>Defesa</b> do alvo, acertou: role o <b>dano</b> da arma + o mesmo atributo.</p><p><b>20 natural</b> no d20 é <b>crítico</b>: acerta sempre e os dados de dano são dobrados. <b>1 natural</b> sempre erra.</p>'+tipBox('app','<p>Na Tela de jogo, quando chegar “Sua vez!”, arraste seu token dentro da área dourada e use ⚔️ Atacar, ✨ Habilidade ou 🧪 Item. Depois toque em ⏭ Encerrar turno. O dano é aplicado sozinho.</p>')],
 ['Vida, caído e cura','<p>A <b>Vida</b> (PV) mostra quanto dano você aguenta. Quando chega a 0, o personagem fica <b>caído</b> (inconsciente) e não age até ser curado. Inimigos com 0 de Vida são derrotados.</p><p>Formas de recuperar: poções, magias de cura (como <i>Curar ferimentos</i>), habilidades (como <i>Segundo fôlego</i>) e descanso.</p>'+tipBox('tip','<p>Fique perto de quem cura e não deixe o mago sozinho na linha de frente — ele tem pouca Vida.</p>')],
 ['Descanso','<ul><li><b>Descanso curto</b> (cerca de 1 hora): recupera parte da Vida e da Mana.</li><li><b>Descanso longo</b> (uma noite de sono): recupera tudo e levanta quem estava caído.</li></ul><p>Descansar em lugar perigoso pode atrair visitas indesejadas — o mestre decide.</p>'],
 ['Magia e recursos','<p>Magias e golpes especiais gastam <b>Mana</b> (ou energia). Algumas magias simples não custam nada e podem ser usadas sempre. Quando a Mana acaba, só um descanso recupera — por isso guarde as magias fortes para os momentos importantes.</p><p>Algumas magias acertam sempre (como <i>Mísseis mágicos</i>); outras pedem um teste de ataque com INT ou SAB contra a Defesa do alvo.</p>'],
 ['Experiência e níveis','<p>Vencer desafios dá <b>XP</b> (experiência). Ao juntar XP suficiente, o personagem <b>sobe de nível</b>: ganha mais Vida, Mana e fica melhor nos ataques.</p><table class="ltab"><tr><th>Nível</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>XP total</th><td>300</td><td>900</td><td>2.700</td><td>6.500</td><td>14.000</td><td>23.000</td><td>34.000</td><td>48.000</td><td>64.000</td></tr></table><p>O bônus de proficiência começa em +2 e sobe para +3 no nível 5, +4 no 9…</p>'],
 ['Boas maneiras na mesa','<ul><li><b>Sessão zero</b>: antes de começar, combinem o tom (aventura leve? terror?), os horários e os temas que ninguém quer ver.</li><li><b>Linhas e véus</b>: “linha” é algo que nunca aparece no jogo; “véu” acontece fora de cena (“a noite passa…”).</li><li>Deixe todos terem seu momento — não fale por cima dos outros.</li><li>Celular de lado durante as cenas importantes.</li><li>Não é competição entre jogadores: o grupo vence junto.</li><li>Na dúvida sobre uma regra, o mestre decide na hora e todos conferem depois.</li></ul>']
];
const GM={
 b:[
  ['O papel do mestre','<p>O mestre tem três chapéus: <b>narrador</b> (descreve o mundo), <b>ator</b> (dá voz aos NPCs e monstros) e <b>juiz</b> (decide quando rolar dados e o que acontece). Você não está contra os jogadores — você é o fã número 1 dos personagens deles. Seu trabalho é criar situações interessantes e reagir às escolhas do grupo.</p>'+tipBox('tip','<p>Você não precisa saber todas as regras. Precisa saber dizer “role um d20 e some sua Destreza” e decidir rápido.</p>')],
  ['A regra de ouro','<p><b>A diversão da mesa vem antes das regras.</b> Se uma regra travar o jogo, decida na hora de forma justa e siga em frente. Anote para conferir depois da sessão.</p><p>Seja consistente: se a corda aguentou o anão ontem, deve aguentar hoje.</p>'],
  ['Sua primeira sessão em 1 hora','<p>Para começar, prepare uma <b>one-shot</b> (aventura de uma noite) com esta receita:</p><ol><li><b>Gancho</b> (1 frase): por que os heróis se envolvem? “O moleiro oferece 50 moedas para descobrir o que rói os sacos do porão.”</li><li><b>Cena 1 — conversa</b>: alguém sabe algo útil (a filha do moleiro viu luzes verdes).</li><li><b>Cena 2 — exploração/obstáculo</b>: um caminho com um problema (o alçapão está trancado e um túnel desce para o escuro).</li><li><b>Cena 3 — clímax</b>: o confronto (três goblins e seu chefe roubando grãos para um ritual).</li><li><b>Recompensa</b>: moedas, um item e uma pista para a próxima aventura (o ritual era para alguém maior…).</li></ol>'+tipBox('app','<p>Use o 🧰 Kit do mestre → “Montar aventura” para sortear uma estrutura dessas e salvá-la como rascunho no seu projeto.</p>')],
  ['Como narrar','<ul><li>Use <b>três sentidos</b>: “O túnel cheira a mofo, a água pinga no seu ombro e, ao longe, algo arranha a pedra.”</li><li>Frases curtas. Descreva o importante e deixe os jogadores perguntarem o resto.</li><li>Termine sempre com uma pergunta: <b>“O que vocês fazem?”</b></li><li>Dê nome às coisas: “a taverna do Javali Torto” fica na memória; “uma taverna” não.</li></ul>'],
  ['Quando pedir um teste','<p>Peça teste só quando houver <b>risco</b> e <b>incerteza</b>. Escolha o atributo que faz sentido e a CD:</p>'+CDT+'<p>Uma falha não deve parar a história: prefira <b>falha com custo</b> — o personagem consegue, mas perde tempo, faz barulho, se machuca ou gasta um recurso.</p>'],
  ['“Sim, e…” e “Sim, mas…”','<p>Quando um jogador tem uma ideia criativa, tente dizer:</p><ul><li><b>“Sim, e…”</b> — dá certo e ainda traz algo a mais.</li><li><b>“Sim, mas…”</b> — dá certo com uma complicação.</li><li><b>“Não, mas…”</b> — não dá, porém abre outra possibilidade.</li></ul>'+tipBox('ex','<p><b>Jogador:</b> “Posso derrubar o lustre em cima dos bandidos?”<br><b>Mestre:</b> “Sim, mas você vai precisar acertar a corda com uma flechada — faça um ataque contra Defesa 14.”</p>')],
  ['Conduzindo um combate no Inkmind','<ol><li>No topo da mesa, toque em <b>▶ Iniciar sessão</b>.</li><li>Na Tela de jogo, use <b>👹 Inimigos</b> para colocar monstros perto do ⭐ Início e arraste-os para a posição.</li><li>Toque em <b>⚔️ Iniciar combate</b> e confirme quem participa. A iniciativa é rolada sozinha.</li><li>Na vez de um inimigo, mova o token e use <b>⚔️ Atacar</b> na barra; depois <b>⏭ Próximo turno</b>.</li><li>Ao final, <b>🏳 Fim do combate</b> divide o XP. Use <b>🏕 Descanso</b> quando o grupo parar para se recuperar.</li></ol>'+tipBox('tip','<p>Comece com encontros pequenos: dois ou três goblins para um grupo de nível 1 já dá um bom combate.</p>')],
  ['Sessão zero e segurança','<p>Antes da primeira aventura, converse com o grupo: estilo de jogo, frequência, temas proibidos (<b>linhas</b>) e temas que só aparecem fora de cena (<b>véus</b>). Combine um sinal simples para pausar uma cena desconfortável, sem precisar se explicar.</p>']
 ],
 m:[
  ['Masmorra de 5 salas','<p>Uma estrutura que funciona para quase qualquer aventura (não precisa ser masmorra):</p><ol><li><b>Entrada e guardião</b>: um obstáculo que justifica por que ninguém chegou ali antes.</li><li><b>Desafio de interação ou enigma</b>: algo que força a pensar, não a lutar.</li><li><b>Armadilha ou reviravolta</b>: algo dá errado, ou nada é o que parece.</li><li><b>Clímax</b>: o grande confronto.</li><li><b>Recompensa ou revelação</b>: tesouro, segredo, gancho para a próxima.</li></ol>'+tipBox('app','<p>Desenhe um mapa por cena e ligue as portas com a ferramenta 🔗 Ligar porta: o grupo verá a animação ao passar de uma sala para outra.</p>')],
  ['Os três pilares','<p>Uma boa sessão alterna <b>exploração</b> (descobrir lugares e segredos), <b>interação</b> (conversar, negociar, investigar) e <b>combate</b>. Observe o que seu grupo mais gosta e dê mais disso — mas sem esquecer os outros pilares.</p>'],
  ['Encontros equilibrados','<p>Some o XP dos inimigos e compare com o orçamento do grupo (por personagem, depois multiplique pelo número de jogadores):</p><table class="ltab"><tr><th>Nível</th><th>Fácil</th><th>Médio</th><th>Difícil</th><th>Mortal</th></tr><tr><td>1</td><td>25</td><td>50</td><td>75</td><td>100</td></tr><tr><td>2</td><td>50</td><td>100</td><td>150</td><td>200</td></tr><tr><td>3</td><td>75</td><td>150</td><td>225</td><td>400</td></tr><tr><td>4</td><td>125</td><td>250</td><td>375</td><td>500</td></tr><tr><td>5</td><td>250</td><td>500</td><td>750</td><td>1.100</td></tr></table><p>Muitos inimigos fracos são mais perigosos do que parecem (agem mais vezes). Se o combate estiver fácil demais, inimigos podem chegar como reforço; se estiver difícil, podem fugir ou se render.</p>'+tipBox('app','<p>O 🧰 Kit do mestre tem uma calculadora de encontro com os monstros do conteúdo inicial.</p>')],
  ['NPCs memoráveis','<p>Para cada NPC importante, anote cinco coisas: <b>nome</b>, <b>um detalhe visível</b> (cicatriz, chapéu enorme), <b>o que ele quer</b>, <b>um jeito de falar ou mania</b> e <b>um segredo</b>.</p>'+tipBox('ex','<p><b>Berta Pé-de-Ferro</b>, ferreira de braços tatuados. Quer pagar a dívida com a guilda. Bate o martelo na bigorna quando discorda. Segredo: forjou as chaves que os ladrões usaram.</p>')+tipBox('app','<p>Guarde NPCs, lugares e facções no Compêndio do seu projeto e use o Kit para sortear personalidades.</p>')],
  ['Ritmo e cenas','<ul><li>Comece perto da ação (“vocês estão na carroça quando a primeira flecha acerta o cavalo”).</li><li>Corte cenas que não têm decisão a tomar: “três dias de viagem depois…”.</li><li>Termine a sessão num momento de tensão — todos voltam curiosos.</li><li>Se a mesa está cansada, introduza um evento: um mensageiro, um rugido, uma traição.</li></ul>'],
  ['Recompensas','<p>Além de ouro e itens, recompense com <b>informação</b> (um mapa, um segredo), <b>aliados</b> (o capitão da guarda agora deve um favor), <b>reputação</b> e <b>escolhas</b> (acesso a um lugar antes proibido). Entregue itens pela ⋯ → Mochila de cada jogador.</p>'],
  ['Improvisar sem medo','<ul><li>Tenha listas prontas: nomes, tavernas, rumores (o Kit sorteia para você).</li><li>Devolva a pergunta: “Você já esteve nessa cidade. O que você lembra dela?”</li><li>Reaproveite: o mapa que os jogadores pularam vira outro lugar.</li><li>Se não sabe a regra, decida algo justo e siga.</li></ul>'],
  ['Cada jogador no holofote','<p>Repare quem está quieto e pergunte diretamente o que o personagem dele faz. Equilibre o tempo de quem domina a mesa. Cada sessão, tente dar um momento especial para cada personagem: um inimigo do passado, uma habilidade que brilha, uma escolha só dele.</p>']
 ],
 a:[
  ['Mundo de dentro para fora','<p>Não escreva um continente inteiro antes de jogar. Comece com <b>uma vila, uma ameaça e um lugar misterioso</b> por perto. Expanda o mundo conforme os jogadores olham para ele. Três perguntas para cada lugar: quem manda aqui, do que as pessoas têm medo, o que está escondido.</p>'+tipBox('app','<p>Use o Compêndio para registrar lugares, facções e linha do tempo; o mapa de região (até 150×150) para a visão geral.</p>')],
  ['Campanhas em arcos','<p>Divida a campanha em <b>arcos</b> de 3 a 6 sessões, cada um com sua pergunta (“quem está envenenando o poço?”). Ao fim de cada arco, a resposta muda o mundo e abre o próximo. Isso dá pontos de parada naturais e evita a campanha sem fim.</p>'],
  ['Vilões com plano e relógio','<p>Um bom vilão tem um <b>objetivo</b>, um <b>plano em etapas</b> e age mesmo quando os heróis estão ocupados. Desenhe um <b>relógio de 6 partes</b> para cada ameaça: a cada sessão em que os heróis não interferem, preencha uma parte. Relógio cheio, o plano se cumpre.</p>'+tipBox('ex','<p>Culto da Lua Pálida: (1) roubar o mapa · (2) sequestrar o sacerdote · (3) abrir a cripta · (4) despertar a criatura · (5) atacar a vila · (6) eclipse eterno.</p>')],
  ['Escolhas com consequência','<p>Deixe as decisões dos jogadores mudarem o mundo de forma visível: o NPC salvo volta para ajudar, a vila abandonada é saqueada, o vilão poupado busca vingança. A sensação de que <b>o mundo lembra</b> é o que torna uma campanha marcante.</p>'],
  ['Mistérios: regra das três pistas','<p>Para cada conclusão que os jogadores precisam tirar, espalhe <b>pelo menos três pistas</b> em lugares diferentes. Eles vão perder uma, interpretar errado outra — e ainda terão a terceira. Nunca dependa de um único teste para o mistério andar.</p>'],
  ['Segredos e pistas flexíveis','<p>Antes da sessão, escreva <b>10 segredos</b> curtos que os jogadores podem descobrir, sem dizer onde estão. Durante o jogo, entregue-os onde fizer sentido: na conversa com o taberneiro, num diário, na boca de um inimigo derrotado. Preparação leve, revelações garantidas.</p>'],
  ['Linear, ramificado ou sandbox','<ul><li><b>Linear</b>: cenas em sequência — ótimo para iniciantes e one-shots.</li><li><b>Ramificado</b>: escolhas levam a caminhos diferentes que se reencontram.</li><li><b>Sandbox</b>: um mapa cheio de lugares e ameaças; os jogadores escolhem para onde ir. Exige mais preparo de situações, não de roteiro.</li></ul><p>Prepare <b>situações</b>, não roteiros: “o barão quer a mina e está disposto a matar” rende mais do que “na cena 4 o barão trai os heróis”.</p>'],
  ['Tom, tema e gênero','<p>Defina o tom com o grupo (heroico, sombrio, cômico, terror) e reforce em tudo: descrições, música, nomes. No terror, revele pouco e use o som; na intriga, dê a cada facção um desejo que conflita com as outras.</p>'+tipBox('app','<p>A ficha “Horror investigativo” traz Sanidade no lugar de Mana — as regras do app usam essa barra como recurso.</p>')],
  ['Personagens no centro','<p>Peça a cada jogador <b>três ganchos</b> da história do personagem (um inimigo, alguém que ele ama, um segredo) e traga-os para a trama. Uma campanha em que o vilão é o irmão desaparecido do ladino vale mais que dez tesouros.</p>'],
  ['Crie suas próprias regras','<p>No Inkmind você pode montar a ficha do zero (Modelo de ficha), criar raças, itens, habilidades e monstros, e ajustar as Regras (Vida, Defesa, Deslocamento, XP). Teste uma mudança por vez, numa sessão curta, e pergunte ao grupo se ficou mais divertido.</p>'],

const _gather16=gather;gather=async function(){const chs=await _gather16();const f=S.view==='export'?S.exp.fmt:'pdf';
 chs.forEach(c=>{const d=document.createElement('div');d.innerHTML=c.html;let run=null;[...d.childNodes].forEach(n=>{if(n.nodeType===1&&BLOCKS.has(n.tagName)){run=null;return}if(n.nodeType===3&&!n.data.trim()){return}if(n.nodeType===8){n.remove();return}if(!run){run=document.createElement('p');n.before(run)}run.appendChild(n)});const ns=$$('sup.fn',d);ns.forEach((s,i)=>s.textContent=i+1);
  if(ns.length&&!['pdf','docx'].includes(f)){const notes=ns.map((s,i)=>{const t=s.getAttribute('title')||'';s.removeAttribute('title');s.className='fnr';s.innerHTML=(f==='html'||f==='epub')?`<a href="#n-${c.id}-${i+1}" id="r-${c.id}-${i+1}">${i+1}</a>`:`[${i+1}]`;return t});
   d.insertAdjacentHTML('beforeend',`<section class="fnotes"><p class="fnh">Notas</p>${notes.map((t,i)=>`<p class="fnp" id="n-${c.id}-${i+1}">${(f==='html'||f==='epub')?`<a href="#r-${c.id}-${i+1}">${i+1}.</a>`:`[${i+1}]`} ${esc(t)}</p>`).join('')}</section>`)}
  if(['md','txt'].includes(f))$$('hr.pgbreak',d).forEach(h=>h.remove());
  c.html=d.innerHTML});return chs};
