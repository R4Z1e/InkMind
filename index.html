<!DOCTYPE html>
<html lang="pt-BR" data-theme="inkmind">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkmind — Estúdio de Histórias e RPG</title>
<link rel="icon" type="image/png" href="img/icon-64.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="theme-color" content="#0d0912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--ui:'Inter',system-ui,-apple-system,sans-serif;--disp:'Fraunces',Georgia,serif;--r:12px}
[data-theme=inkmind]{--bg:#0d0912;--panel:#150f1d;--panel2:#1c1427;--ink:#f1eadf;--muted:#a597b6;--line:#2e2342;--accent:#9d5cff;--accent-ink:#fff;--accent2:#ff9640;--paper:#191222;--paper-ink:#f1eadf;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45)}
[data-theme=inkmind-claro]{--bg:#f3eee6;--panel:#fbf8f3;--panel2:#f0e9de;--ink:#22172e;--muted:#76688a;--line:#e1d5c5;--accent:#7b3fe4;--accent-ink:#fff;--accent2:#e8731f;--paper:#fffdf9;--paper-ink:#22172e;--shadow:0 1px 2px rgba(60,30,90,.08),0 10px 30px rgba(60,30,90,.10)}
[data-theme=pergaminho]{--bg:#ebe1cc;--panel:#f6efe0;--panel2:#efe5cf;--ink:#2a2017;--muted:#7a6a55;--line:#d7c7a7;--accent:#8b3a2b;--accent-ink:#fff;--paper:#fcf8ef;--paper-ink:#2a2017;--shadow:0 1px 2px rgba(60,40,20,.08),0 10px 30px rgba(60,40,20,.10)}
[data-theme=noite]{--bg:#121419;--panel:#1a1d24;--panel2:#20242d;--ink:#e8e3d7;--muted:#8d92a0;--line:#2c313c;--accent:#c9a45c;--accent-ink:#17130a;--paper:#1d212b;--paper-ink:#e8e3d7;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
[data-theme=claro]{--bg:#f2f2ef;--panel:#ffffff;--panel2:#f7f7f5;--ink:#1d1d1f;--muted:#6b6b70;--line:#e2e2de;--accent:#3651c9;--accent-ink:#fff;--paper:#ffffff;--paper-ink:#1d1d1f;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.07)}
[data-theme=grimorio]{--bg:#0d1714;--panel:#13211c;--panel2:#182a23;--ink:#ebe5cf;--muted:#8ea395;--line:#24392f;--accent:#d4a84a;--accent-ink:#14100a;--paper:#12201a;--paper-ink:#ebe5cf;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:#c0392b}
.btn:disabled{opacity:.5;cursor:default}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
input[type=color]{padding:2px;height:36px;width:56px}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 4px;font:600 17px var(--disp)}
.card > p.muted{margin:0 0 8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin:10px 0}
.toggle input{display:none}
.toggle .sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{left:18px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--panel2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop b{color:var(--ink)}

/* splash */
#splash{position:fixed;inset:0;display:grid;place-items:center;font:500 18px var(--disp);color:var(--muted)}
#splash .q{font-size:42px;color:var(--accent);display:block;text-align:center;margin-bottom:8px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}

/* home */
.home{height:100%;overflow:auto}
.home-h{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font:700 22px var(--disp);display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px}
.hero{padding:40px 28px 10px;max-width:1180px;margin:0 auto}
.hero h1{font:600 40px/1.1 var(--disp);margin:0 0 8px;letter-spacing:-.02em}
.hero p{margin:0 0 20px;color:var(--muted);font-size:16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;padding:24px 28px 60px;max-width:1180px;margin:0 auto}
.book{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.cover{aspect-ratio:2/3;border-radius:6px 12px 12px 6px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;transition:transform .2s}
.book:hover .cover{transform:translateY(-4px) rotate(-.5deg)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08),transparent);z-index:2}
.cover .ct{position:relative;z-index:1;font:600 21px/1.15 var(--disp);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cover .ca{position:relative;z-index:1;font-size:12px;opacity:.85;margin-top:4px}
.cover.hasimg::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.cover.hasimg .ct,.cover.hasimg .ca{z-index:3}
.book-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.book-meta b{font-weight:600;font-size:14px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newbook{background:transparent;font:inherit;cursor:pointer;aspect-ratio:2/3;border:2px dashed var(--line);border-radius:6px 12px 12px 6px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;transition:.15s}
.newbook:hover{border-color:var(--accent);color:var(--ink)}
.newbook .big{font-size:34px;line-height:1;display:block;margin-bottom:6px;color:var(--accent)}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typepick label{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:block;background:var(--paper)}
.typepick label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.typepick input{display:none}
.typepick .tt{font:600 16px var(--disp);display:block}

/* workspace */
.ws{height:100%;display:grid;grid-template-columns:212px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:2px;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;min-height:0;overflow:auto}
.rail .rback{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px}
.rail .rback:hover{background:var(--panel2);color:var(--ink)}
.ptitle{font:600 17px/1.2 var(--disp);background:transparent;border:1px solid transparent;width:100%;padding:6px 8px;margin:4px 0 10px}
.ptitle:hover{border-color:var(--line)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.rail nav button:hover{background:var(--panel2);color:var(--ink)}
.rail nav button.on{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent),0 1px 2px rgba(0,0,0,.05)}
.rail .rsep{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 10px 4px}
.rail .rfoot{margin-top:auto;padding:10px 8px 2px}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status .d{width:7px;height:7px;border-radius:50%;background:#3aa76d}
.status.saving .d{background:#e0a030}
.status.err .d{background:#d0453a}
#view{min-height:0;overflow:hidden;position:relative}
.scrollview{height:100%;overflow:auto;padding:28px 24px 80px}
.wrapc{max-width:1100px;margin:0 auto}
.vh{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{font:600 28px/1.1 var(--disp);margin:0;letter-spacing:-.01em}
.vh p{margin:4px 0 0;color:var(--muted)}

/* write */
.write{display:grid;grid-template-columns:270px 1fr auto;height:100%;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.side-h b{font:600 15px var(--disp)}
.chlist{list-style:none;margin:0;padding:4px 8px;overflow:auto;flex:1}
.ch{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;cursor:pointer;position:relative;border:1px solid transparent}
.ch:hover{background:var(--panel2)}
.ch.on{background:var(--paper);border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ch.dragover{border-top:2px solid var(--accent)}
.ch .n{font:600 12px var(--disp);color:var(--muted);width:20px;text-align:center;flex:none}
.ch .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .w{font-size:11px;color:var(--muted)}
.ch .ops{display:none;gap:1px}
.ch:hover .ops,.ch.on .ops{display:flex}
.ch:hover .w,.ch.on .w{display:none}
.ch .ops button{border:0;background:transparent;padding:2px 4px;border-radius:5px;color:var(--muted);line-height:1}
.ch .ops button:hover{background:var(--line);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.st-rascunho{background:#b9a98e}.st-revisao{background:#e0a030}.st-pronto{background:#3aa76d}
.side-f{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.goal{display:flex;align-items:center;gap:6px;margin-top:8px}
.goal input{width:90px;padding:3px 6px;font-size:12px}
.ed{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:thin}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 5px;flex:none}
.tb{border:0;background:transparent;min-width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink);flex:none;padding:0 6px}
.tb:hover{background:var(--panel2)}
.tb.on{background:var(--panel2);color:var(--accent)}
.tb.txt{font-weight:700;font-family:Georgia,serif;font-size:15px}
.toolbar select{width:auto;padding:5px 8px;font-size:13px;background:var(--panel);flex:none}
.stage{position:relative;flex:1;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;padding:36px 18px 140px}
.wm-layer{position:absolute;inset:0 12px 0 0;pointer-events:none;z-index:2}
.paper{max-width:var(--pw,720px);margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:64px 72px 90px;border-radius:3px;box-shadow:var(--shadow);min-height:75vh;position:relative}
.ch-kicker{text-align:center;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--muted);margin-bottom:6px}
.ch-title{display:block;width:100%;text-align:center;font-family:var(--hf);font-size:calc(var(--fs) * 1.9);font-weight:600;border:0;background:transparent;color:var(--paper-ink);padding:4px;margin-bottom:34px;line-height:1.2}
.ch-title:focus{outline:1px dashed var(--line)}
.ed-f{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);flex-wrap:wrap}
.ed-f select{width:auto;padding:3px 6px;font-size:12px}
.notes{width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);transition:width .2s;display:flex;flex-direction:column}
.notes.open{width:300px}
.notes .in{padding:14px;width:300px;display:flex;flex-direction:column;gap:8px;height:100%}
.notes textarea{flex:1;min-height:200px;background:var(--paper)}
.notes h4{margin:0;font:600 15px var(--disp)}
body.focus .side,body.focus .rail,body.focus .toolbar{display:none}
body.focus .ws{grid-template-columns:1fr}
body.focus .write{grid-template-columns:1fr auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font:600 22px var(--disp);color:var(--ink);margin-bottom:6px}
#imgbar{position:fixed;z-index:50;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
#imgbar button{border:0;background:transparent;padding:4px 8px;border-radius:6px;font-size:12px}
#imgbar button:hover{background:var(--panel2)}

/* prose (editor + previews) */
.prose{font-family:var(--bf);font-size:var(--fs);line-height:var(--lh);text-align:var(--align);outline:none;min-height:40vh;word-wrap:break-word}
.prose p{margin:0;text-indent:var(--ind,1.6em)}
.prose.web p{text-indent:0;margin:0 0 .9em}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--hf);line-height:1.25;text-indent:0;margin:1.4em 0 .6em;font-weight:600}
.prose h1{font-size:1.7em;text-align:center}.prose h2{font-size:1.4em}.prose h3{font-size:1.15em}
.prose > :first-child{margin-top:0}
.prose.dropcap > p:first-child{text-indent:0}
.prose.dropcap > p:first-child::first-letter{float:left;font-family:var(--hf);font-size:3.5em;line-height:.82;padding:.06em .1em 0 0;color:var(--accent);font-weight:600}
.prose blockquote{margin:1em 1.5em;font-style:italic;border-left:3px solid var(--line);padding-left:1em}
.prose blockquote p{text-indent:0}
.prose ul,.prose ol{margin:.6em 0;padding-left:1.6em}
.prose li p{text-indent:0}
.prose hr,.prose hr.scene{border:0;height:1.6em;margin:1.2em 0;text-align:center;overflow:visible}
.prose hr::before{content:'✦  ✦  ✦';color:var(--muted);font-size:.9em;letter-spacing:.3em}
.prose img{max-width:100%;height:auto;display:block;margin:1.2em auto;border-radius:3px;cursor:pointer}
.prose img.sel{outline:3px solid var(--accent);outline-offset:2px}
.prose a{color:var(--accent)}
.prose .boxed{display:block;background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-left:4px solid var(--accent);padding:.9em 1.1em;margin:1.2em 0;border-radius:4px;font-style:italic}
.prose .boxed p{text-indent:0}
.prose .statblock{display:block;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent);padding:.8em 1em;margin:1.2em 0;font-family:var(--ui);font-size:.82em;line-height:1.45;text-align:left}
.prose .statblock h4{margin:0;font-family:var(--hf);color:var(--accent);font-size:1.45em}
.prose .statblock p{text-indent:0;margin:.3em 0}
.prose .statblock .sb-sub{font-style:italic;color:var(--muted);margin:0 0 .5em}
.prose .statblock table{border-collapse:collapse;width:100%;margin:.5em 0;text-align:center}
.prose .statblock th{font-size:.85em;color:var(--accent);padding:2px 4px}
.prose .statblock td{padding:2px 4px}

/* codex */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.15s}
.cx:hover{border-color:var(--muted);transform:translateY(-2px)}
.cx .im{aspect-ratio:16/10;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font:600 30px var(--disp);overflow:hidden}
.cx .im img{width:100%;height:100%;object-fit:cover}
.cx .bd{padding:12px 14px}
.cx .nm{font:600 16px var(--disp);margin-bottom:4px}
.cx .at{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.attr-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.ent-img{width:100%;aspect-ratio:1;border-radius:12px;background:var(--panel2);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--muted);text-align:center;font-size:13px}
.ent-img img{width:100%;height:100%;object-fit:cover}
.ent-grid{display:grid;grid-template-columns:200px 1fr;gap:18px}

/* dice */
#dice-fab{position:fixed;right:20px;bottom:20px;z-index:30;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px}
#dice{position:fixed;right:20px;bottom:86px;z-index:30;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:none}
#dice.open{display:block}
#dice .res{font:700 40px var(--disp);text-align:center;color:var(--accent);margin:6px 0 0;min-height:48px}
#dice .det{font-size:12px;color:var(--muted);text-align:center;min-height:18px;word-break:break-word}
.dq{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.dhist{max-height:120px;overflow:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:8px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:18px}
.gi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gi .im{aspect-ratio:1;background:var(--panel2) repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;display:grid;place-items:center}
.gi .im img{max-width:100%;max-height:100%;object-fit:contain}
.gi .bd{padding:8px 10px}
.gi .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.gi .acts{display:flex;flex-wrap:wrap;gap:4px}

/* converter / style / export */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conv-prev{background:var(--panel2) repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:10px;min-height:180px;display:grid;place-items:center;overflow:hidden;margin-top:12px}
.conv-prev img,.conv-prev canvas{max-width:100%;max-height:360px;display:block}
.chprev{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--paper)}
.chprev div{padding:8px 12px;border-bottom:1px solid var(--line)}
.chprev div:last-child{border:0}
.style-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.preview-sticky{position:sticky;top:0}
.prev-paper{background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow);border-radius:3px;padding:44px 48px;position:relative;overflow:hidden;min-height:440px}
.prev-paper .wmp{position:absolute;inset:0;pointer-events:none}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme-sw{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left}
.theme-sw.on{border-color:var(--accent)}
.theme-sw .tp{height:46px;display:flex;align-items:flex-end;padding:6px;gap:4px}
.theme-sw .tp i{display:block;height:20px;flex:1;border-radius:3px}
.theme-sw span{display:block;padding:6px 8px;font-size:12px;background:var(--panel)}
.fontbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 12px;text-align:left;font-size:17px}
.fontbtn small{font-family:var(--ui);font-size:11px;color:var(--muted)}
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.fp-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);text-align:left}
.fp-item:hover,.fp-item.on{border-color:var(--accent)}
.fp-item .s{font-size:22px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-item small{font-family:var(--ui);color:var(--muted);font-size:11px}
.fp-cat{font:600 13px var(--disp);color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.fmt{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.fmt b{font:600 15px var(--disp)}
.fmt small{color:var(--muted);font-size:12px}
.fmt.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.cklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper)}
.cklist label{display:flex;gap:8px;align-items:center;padding:4px 0}
.slider-row{display:grid;grid-template-columns:1fr 54px;gap:10px;align-items:center}
.slider-row output{font-size:12px;color:var(--muted);text-align:right}
.fontlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fontlist div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(10,8,5,.45);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(480px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.dlg.wide{width:min(860px,100%)}
.dlg-h{display:flex;align-items:center;padding:16px 18px 8px}
.dlg-h h3{margin:0;font:600 20px var(--disp);flex:1}
.dlg-h .x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
.dlg-b{padding:4px 18px 10px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;max-width:90vw;animation:fade .2s}
.toast.err{background:#b3261e;color:#fff}
.busy{position:fixed;inset:0;background:rgba(10,8,5,.5);z-index:150;display:grid;place-items:center;color:#fff;font:500 16px var(--ui)}
.busy .bx{background:var(--panel);color:var(--ink);padding:22px 28px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none}


/* estrutura (árvore) */
.tree{overflow:auto;flex:1;padding:2px 10px 12px}
.tproj{display:flex;align-items:center;gap:8px;padding:8px 6px;font:600 14px var(--disp);border-radius:9px}
.tproj .t,.tf-h .t,.td-h .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{list-style:none;margin:0 0 0 14px;padding:0 0 0 12px;border-left:1.5px solid var(--line)}
.tl>li{position:relative}
.tl>li::before{content:'';position:absolute;left:-12px;top:19px;width:9px;border-top:1.5px solid var(--line)}
.tl>li:last-child::after{content:'';position:absolute;left:-14px;top:20px;bottom:0;width:4px;background:var(--panel)}
.tf-h,.td-h{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px}
.tf-h:hover,.td-h:hover{background:var(--panel2)}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);font-size:10px;width:10px}
.tf.closed .caret{transform:rotate(-90deg)}.tf.closed>.tl{display:none}
.cnt{font-size:11px;color:var(--muted);font-weight:400}
.tf-h .ops{display:none;gap:1px}.tf-h:hover .ops{display:flex}.tf-h:hover .cnt{display:none}
.tf-h .ops button{border:0;background:transparent;padding:2px 6px;border-radius:5px;color:var(--muted)}
.tf-h .ops button:hover{background:var(--line);color:var(--ink)}
.td{margin-top:14px;padding-top:6px;border-top:1px dashed var(--line)}
.td-h{color:var(--muted);cursor:default}
.tempty{font-size:12px;color:var(--muted);padding:6px 8px;font-style:italic}
.dragover{background:color-mix(in srgb,var(--accent) 14%,transparent)!important;border-radius:9px}
.ch.dragover{border-top:2px solid var(--accent)}
.menu-list{display:flex;flex-direction:column;gap:6px}.menu-list .btn{justify-content:flex-start}
@media (hover:none){.ch .ops,.tf-h .ops{display:flex}.ch .w,.tf-h .cnt{display:none}}
/* estante: pastas e mesas */
.homewrap{max-width:1180px;margin:0 auto;padding:6px 28px 0}
.shelf-chips{margin:0}
.book{position:relative}
.bk-menu{position:absolute;top:8px;right:8px;z-index:6;border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;width:32px;height:26px;line-height:1;font-size:16px;opacity:0;transition:.15s}
.book:hover .bk-menu{opacity:1}
@media (hover:none){.bk-menu{opacity:1}}
.mesas{max-width:1180px;margin:0 auto;padding:0 28px 60px}
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mesa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mesa:hover{border-color:var(--accent)}.mesa{position:relative;cursor:pointer}
.mesa-del{position:absolute;top:8px;right:8px;border:0;background:transparent;border-radius:8px;padding:4px 6px;opacity:.5}.mesa-del:hover{opacity:1;background:var(--panel2)}
.mgrp{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.mgrp:first-child{border-top:0;margin-top:0;padding-top:2px}
.stylecv{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mapscroll.darkbg{background:#1a1714}.mesa .mz{font-size:26px}.mesa b{font:600 17px var(--disp)}.mesa small{color:var(--muted)}
/* mesa de jogo */
.tbl{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.tbl-h{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.tbl-h .tt{font:600 18px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modesw button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-weight:600}
.subtabs{display:flex;gap:4px;padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:transparent;padding:7px 12px;border-radius:9px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;font-weight:500}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),inset 0 -2px 0 var(--accent)}
.tbl-b{display:grid;min-height:0}
.tbl-b.player{grid-template-columns:minmax(0,1fr) 300px}
.tbl-b.master{grid-template-columns:310px minmax(0,1fr)}
.tmain{overflow:auto;min-height:0;position:relative}
.tpad{padding:22px 22px 80px;max-width:1100px;margin:0 auto}
.tpad.narrow{max-width:660px}
.stpanel{background:var(--panel);overflow:auto;padding:14px;min-height:0}
.stpanel.right{border-left:1px solid var(--line)}.stpanel.left{border-right:1px solid var(--line)}
.stpanel h4{margin:0;font:600 15px var(--disp)}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.pc.me{border-color:var(--accent)}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pc-h b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-h small{color:var(--muted);font-size:11px}
.tok{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.25)}
.tok.big{width:54px;height:54px;font-size:28px}
.sb{display:grid;grid-template-columns:64px 1fr auto auto;gap:5px;align-items:center;margin:5px 0;font-size:11px}
.sb .lbl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{position:relative;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#c0392b;transition:width .3s}
.sbar em{position:relative;display:block;text-align:center;font-style:normal;font-size:10.5px;font-weight:700;line-height:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sbar.c1 i{background:#2e86de}.sbar.c2 i{background:#8e44ad}.sbar.c3 i{background:#27ae60}.sbar.c4 i{background:#e67e22}
.sbar.big{height:22px}.sbar.big em{line-height:22px;font-size:12px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:24px;height:24px;padding:0 4px;line-height:1;font-size:13px}
.mini:hover{border-color:var(--accent)}
.conds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cond{font-size:11px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:99px;padding:2px 8px;display:inline-flex;gap:4px;align-items:center}
.cond button{border:0;background:none;padding:0;color:var(--muted)}
.cond.add{background:transparent;border-style:dashed;color:var(--muted)}
.sheet .card{margin-bottom:14px}
.sf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.sf>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.sf.wide{grid-column:1/-1}
.sf-bar{grid-column:span 2}.sf-bar .row{margin-top:6px}.sf-bar input{width:84px}
.sf-attr{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px}
.sf-attr input{text-align:center;font:600 22px var(--disp);border:0;background:transparent;padding:2px}
.sf-attr .mod{display:inline-block;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin-top:2px}
.sf input:disabled,.sf textarea:disabled,.sf select:disabled{opacity:.75}
.sheet-top{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.tpl-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.tsec{margin-bottom:12px}.tsec input.tsec-t{font:600 16px var(--disp)}
.tfield{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.1fr) minmax(0,.9fr) auto auto;gap:6px;align-items:center;margin:8px 0}
.tfo{display:flex;gap:2px}
.lockck{display:flex;align-items:center;gap:2px;font-size:13px;cursor:pointer}
.mapview{display:flex;flex-direction:column;height:100%}
.mapbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.mapbar select{width:auto;max-width:200px}
.medit{display:flex;flex:1;min-height:0}
.mtools{display:flex;flex-direction:column;gap:2px;padding:6px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;width:72px;flex:none}
.mtool{border:1px solid transparent;background:transparent;border-radius:9px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mtool span{font-size:18px;line-height:1.15}.mtool small{font-size:10px;color:var(--muted)}
.mtool:hover{background:var(--panel2)}.mtool.on{background:var(--paper);border-color:var(--accent)}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column}
.stamps{display:flex;flex-wrap:wrap;gap:3px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.stamps button{border:1px solid transparent;background:transparent;border-radius:7px;font-size:19px;width:34px;height:32px;padding:0}
.stamps button.on{border-color:var(--accent);background:var(--paper)}
.mapscroll{flex:1;overflow:auto;background:#d6cfbf;padding:20px;min-height:0}
.mapscroll canvas{display:block;box-shadow:0 2px 14px rgba(0,0,0,.22);touch-action:none;cursor:crosshair;margin:0 auto}
.mapscroll canvas.hand,.mapview:not(.editor) canvas{cursor:grab}
.mapHint{padding:4px 12px;margin:0;background:var(--panel)}
.invi{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.invi .ic{font-size:26px;width:40px;text-align:center;flex:none}
.invi small{display:block;color:var(--muted)}.invi p{margin:4px 0 0;font-size:13px}
.invmini{padding:4px 0;border-bottom:1px solid var(--line)}
.ent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ent:hover{border-color:var(--muted)}.ent .ic{font-size:26px}.ent b{font:600 16px var(--disp)}.ent small{color:var(--muted)}
.dlog{max-height:420px;overflow:auto;font-size:13px}
.dlog>div{padding:6px 0;border-bottom:1px solid var(--line)}.dlog b{color:var(--accent);font-size:16px}
.dicecard .res{font:700 52px var(--disp);text-align:center;color:var(--accent);min-height:62px}
.dicecard .det{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin-bottom:10px}
.dicecard .dq{grid-template-columns:repeat(4,1fr)}
.emo-grid{display:flex;flex-wrap:wrap;gap:4px}.emo-grid button{font-size:20px;width:38px;height:36px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:0}
.emo-grid button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.col-grid{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.col-grid button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.col-grid button.on{box-shadow:0 0 0 3px var(--accent)}
.pregens{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:6px}
.pregens label{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--paper);display:flex;gap:8px;align-items:center}
.pregens label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.pregens input{display:none}
.ckrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.notice{background:color-mix(in srgb,#e0a030 15%,transparent);border:1px solid color-mix(in srgb,#e0a030 40%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (max-width:860px){
  .tbl-b.player,.tbl-b.master{grid-template-columns:1fr}
  .stpanel{position:fixed;top:0;bottom:0;width:86%;max-width:340px;z-index:60;transition:transform .25s;box-shadow:var(--shadow)}
  .stpanel.right{right:0;transform:translateX(105%)}.stpanel.left{left:0;transform:translateX(-105%)}.stpanel.open{transform:none}
  .tpl-grid{grid-template-columns:1fr}
  .tfield{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .tpad{padding:14px 12px 80px}.sf-bar{grid-column:1/-1}
  .homewrap,.mesas{padding-left:16px;padding-right:16px}
  .mtools{width:56px}.mtool small{display:none}
  .modesw button{padding:7px 10px}
  .tbl-h{padding:6px 8px;gap:6px}
}

.tpltabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tpltabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px;font-weight:500}
.tpltabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpltabs .cnt{opacity:.7;font-size:11px}
.ent .at{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}.co-grid .wide{grid-column:1/-1}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.choice{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.choice input{display:none}.choice small{color:var(--muted)}.choice .at{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.choice .pill{font-size:10px;padding:2px 6px}
.ro-val{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;font-weight:500}
.ro-long{white-space:pre-wrap;font-weight:400}
.sf-choice small{display:block;margin-top:4px;font-size:11px}
.mpill{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.mpill.on{color:#1e8e4e;border-color:#9fd8b6;background:#e6f6ec}
.mstat{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0;font-weight:500;color:var(--muted)}
.mstat .d{width:10px;height:10px;border-radius:50%;background:#c9a24a;animation:pulse 1.4s infinite}
.mstat.on{color:#1e8e4e}.mstat.on .d{background:#27ae60;animation:none}

const WQ={};
function queueWrite(key,val){
 const q=WQ[key]||(WQ[key]={running:false,has:false,val:null});
 q.val=val===null?null:clone(val);q.has=true;
 if(!q.running)runQ(key);
}
async function runQ(key){
 const q=WQ[key];q.running=true;setStatus('saving');
 while(q.has){
  const v=q.val;q.has=false;
  try{await Store.put(key,v)}
  catch(e){
   let tries=0;
   if(e&&e.code==='unavailable'&&tries++<1){await sleep(600+Math.random()*800);try{await Store.put(key,v);continue}catch(e2){e=e2}}
   console.warn('save',key,e);
   const msg=(e&&(e.code==='invalid_argument'))?'Este conteúdo ficou grande demais para salvar (limite ~250 KB por capítulo). Divida o capítulo ou use imagens da Galeria.'
    :(e&&e.code==='quota_exceeded')?'Espaço de armazenamento cheio. Exclua projetos antigos.'
    :(e&&e.name==='QuotaExceededError')?'O armazenamento do navegador encheu. Use imagens menores ou exporte um backup.'
    :'Não foi possível salvar agora. Tentaremos de novo na próxima alteração.';

  }
 }
 q.running=false;

}

/* ============ imagens e arquivos ============ */
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Imagem não pôde ser lida'));i.src=src})}
function canvasBlob(c,type,q){return new Promise(r=>c.toBlob(r,type,q))}
async function downscale(src,maxDim,type='image/webp',q=.85){
 const img=await loadImg(src);const k=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
 const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);
 return {blob:await canvasBlob(c,type,q),w:c.width,h:c.height};
}
/* guarda uma imagem e devolve {src,w,h} */
async function storeImage(file){
 const okTypes=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml'];
 if(file.type&&!file.type.startsWith('image/'))throw new Error('Isso não parece uma imagem.');
 const url=URL.createObjectURL(file);
 try{
  let img;try{img=await loadImg(url)}catch{throw new Error('Formato de imagem não suportado pelo navegador (tente PNG, JPG ou WEBP).')}
  const W=img.naturalWidth,H=img.naturalHeight;
  if(S.assets){
   let blob=file,type=file.type;
   if(!okTypes.includes(type)||file.size>8e6||Math.max(W,H)>3200){const r=await downscale(url,3200,'image/webp',.88);blob=r.blob;type='image/webp'}
   const up=await S.assets.upload(blob,{type});
   return {src:'/_blob/'+up.id,assetId:up.id,w:W,h:H};
  }
  const r=await downscale(url,1400,'image/webp',.8);
  return {src:await fileToDataURL(r.blob),w:r.w,h:r.h};
 }finally{URL.revokeObjectURL(url)}
}

ACT.importBackup=async()=>{
 const [f]=await pickFile('.json,application/json');if(!f)return;
 try{
  const data=JSON.parse(await f.text());if(!['escritas','inkmind'].includes(data.app)||!data.project)throw 0;
  const p=data.project;const oldChs=data.chapters||{};
  p.id=uid();p.kind='project';p.title=p.title+(S.projects.some(x=>x.title===p.title)?' (cópia)':'');
  const idmap={};p.chapters=p.chapters.map(c=>{const nid=uid();idmap[c.id]=nid;const d=oldChs[c.id]||{};queueWrite('c_'+nid,{kind:'chapter',pid:p.id,id:nid,html:d.html||'',notes:d.notes||''});return{...c,id:nid}});
  if(Array.isArray(p.outline))p.outline=p.outline.map(n=>n.t==='f'?{...n,id:uid(),items:(n.items||[]).map(i=>idmap[i]).filter(Boolean)}:{t:'c',id:idmap[n.id]}).filter(n=>n.t==='f'||n.id);
  p.drafts=Array.isArray(p.drafts)?p.drafts.map(i=>idmap[i]).filter(Boolean):[];
  p.settings=Object.assign(defaultSettings(p.type,p.title),p.settings||{});p.lastCh=null;
  S.projects.push(clone(p));queueWrite('p_'+p.id,p);renderHome();toast('Backup restaurado: '+p.title);
 }catch{toast('Arquivo de backup inválido.','err')}
};

function ensureOutline(p){

 p.drafts=Array.isArray(p.drafts)?p.drafts:[];
 const take=id=>ids.has(id)&&!seen.has(id)&&!!seen.add(id);
 p.outline=p.outline.filter(n=>{if(n&&n.t==='f'){n.items=(n.items||[]).filter(take);n.title=n.title||'Pasta';return true}return n&&take(n.id)});
 p.drafts=p.drafts.filter(take);
 p.chapters.forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);p.outline.push({t:'c',id:c.id})}});

 for(let k=0;k<p.outline.length;k++){const n=p.outline[k];if(n.t==='c'&&n.id===id){p.outline.splice(k,1);return}if(n.t==='f'){i=n.items.indexOf(id);if(i>=0){n.items.splice(i,1);return}}}}

/* ---------- MARCA D'ÁGUA ---------- */
async function wmItem(wm,ratio=2){
 let bw,bh,draw;
 if(wm.type==='image'&&wm.image){
  let img;try{img=await loadImg(wm.image)}catch{return null}
  bw=(wm.imgScale||35)/100*400;bh=bw*img.naturalHeight/img.naturalWidth;
  draw=x=>x.drawImage(img,-bw/2,-bh/2,bw,bh);
 }else{
  const lines=String(wm.text||'').split('\n').filter(Boolean);if(!lines.length)return null;
  const font=`600 ${wm.size}px ${fontStack(wm.font)}`;try{await document.fonts.load(font,lines.join(''))}catch{}
  const m=document.createElement('canvas').getContext('2d');m.font=font;
  bw=Math.max(...lines.map(l=>m.measureText(l).width));bh=lines.length*wm.size*1.2;
  draw=x=>{x.font=font;x.fillStyle=wm.color;x.textAlign='center';x.textBaseline='middle';lines.forEach((l,i)=>x.fillText(l,0,(i-(lines.length-1)/2)*wm.size*1.2))};
 }
 const t=(wm.rotation||0)*Math.PI/180,RW=Math.abs(bw*Math.cos(t))+Math.abs(bh*Math.sin(t)),RH=Math.abs(bw*Math.sin(t))+Math.abs(bh*Math.cos(t));
 return {bw,bh,RW,RH,render:(gap=0)=>{
  const c=document.createElement('canvas');c.width=Math.ceil((RW+gap)*ratio);c.height=Math.ceil((RH+gap)*ratio);
  const x=c.getContext('2d');x.scale(ratio,ratio);x.translate((RW+gap)/2,(RH+gap)/2);x.rotate(t);x.globalAlpha=clamp(wm.opacity,0,1);draw(x);
  return c}};
}
const WM_POS={center:'center center','br':'right 28px bottom 28px','bl':'left 28px bottom 28px','tr':'right 28px top 28px','tl':'left 28px top 28px'};
let wmSeq=0;
async function renderWmLayer(el,on,wmOverride){
 if(!el)return;const seq=++wmSeq;const wm=wmOverride||P().settings.wm;
 if(!on){el.style.backgroundImage='none';return}
 const it=await wmItem(wm,2);if(seq!==wmSeq&&!wmOverride)return;
 if(!it){el.style.backgroundImage='none';return}
 const tile=wm.mode==='tile',gap=tile?(+wm.gap||0):0,c=it.render(gap);
 el.style.backgroundImage=`url(${c.toDataURL('image/png')})`;
 el.style.backgroundSize=`${(it.RW+gap)}px ${(it.RH+gap)}px`;
 el.style.backgroundRepeat=tile?'repeat':'no-repeat';
 el.style.backgroundPosition=tile?'center top':WM_POS[wm.mode]||'center';
}
async function watermarkCanvas(ctx,W,H,wm){
 const k=W/800,it=await wmItem(wm,k);if(!it)return;
 if(wm.mode==='tile'){const c=it.render(+wm.gap||0);const pat=ctx.createPattern(c,'repeat');ctx.save();ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore();return}
 const c=it.render(0),w=c.width,h=c.height,m=28*k;
 const pos={center:[(W-w)/2,(H-h)/2],br:[W-w-m,H-h-m],bl:[m,H-h-m],tr:[W-w-m,m],tl:[m,m]}[wm.mode]||[(W-w)/2,(H-h)/2];
 ctx.drawImage(c,pos[0],pos[1]);
}
async function watermarkPdf(pdf,wm,pageWmm){
 const k=pageWmm/(P().settings.pageWidth*0.2646)*0.2646; // mm por px do editor
 const it=await wmItem(wm,3);if(!it)return;
 const tile=wm.mode==='tile',gap=tile?(+wm.gap||0):0;const c=it.render(gap),url=c.toDataURL('image/png');
 const w=(it.RW+gap)*k,h=(it.RH+gap)*k,n=pdf.internal.getNumberOfPages(),PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),m=10;
 for(let i=1;i<=n;i++){pdf.setPage(i);
  if(tile){for(let y=0;y<PH;y+=h)for(let x=0;x<PW;x+=w)pdf.addImage(url,'PNG',x,y,w,h,'wm','FAST')}
  else{const pos={center:[(PW-w)/2,(PH-h)/2],br:[PW-w-m,PH-h-m],bl:[m,PH-h-m],tr:[PW-w-m,m],tl:[m,m]}[wm.mode]||[(PW-w)/2,(PH-h)/2];pdf.addImage(url,'PNG',pos[0],pos[1],w,h,'wm','FAST')}
 }
}

const diceHist=[];
ACT.dice=()=>{const d=$('#dice');if(!d.classList.contains('open')){renderDice()}d.classList.toggle('open')};
function renderDice(last){
 const d=$('#dice');d.innerHTML=`<div class="row"><b style="font:600 15px var(--disp)">Rolador de dados</b><span class="sp"></span><button class="btn sm ghost" data-act="dice">×</button></div>
  <div class="res">${last?last.total:'—'}</div><div class="det">${last?esc(last.expr+' → '+last.detail):'Ex.: 1d20+5, 4d6, 2d8-1'}</div>
  <div class="dq">${[4,6,8,10,12,20,100].map(n=>`<button class="btn sm" data-roll="1d${n}">d${n}</button>`).join('')}<button class="btn sm" data-roll="4d6">4d6</button></div>
  <div class="row"><input id="dexp" placeholder="2d6+3" value="${esc(last?last.expr:'')}"><button class="btn primary" id="dgo">Rolar</button></div>
  <div class="dhist">${diceHist.slice(0,12).map(h=>`<div><b style="color:var(--ink)">${h.total}</b> · ${esc(h.expr)} <span>${esc(h.detail)}</span></div>`).join('')||'Nenhuma rolagem ainda.'}</div>`;
 const go=ex=>{try{const r=roll(ex);diceHist.unshift(r);renderDice(r)}catch{toast('Expressão inválida. Use algo como 2d6+3.','err')}};
 $$('[data-roll]',d).forEach(b=>b.onclick=()=>go(b.dataset.roll));
 $('#dgo',d).onclick=()=>go($('#dexp',d).value);$('#dexp',d).onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};
}
function roll(expr){
 const s=String(expr).replace(/\s+/g,'').toLowerCase();
 if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s))throw new Error('inv');
 let total=0;const parts=[],dice=[];const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n)};
 s.replace(/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g,(m,sg,n,f,sg2,c)=>{
  if(f){const cnt=clamp(+n||1,1,100),fc=clamp(+f,2,1000);const rs=Array.from({length:cnt},()=>rnd(fc));rs.forEach(v=>dice.push({f:fc,v}));const sum=rs.reduce((a,b)=>a+b,0);total+=sg==='-'?-sum:sum;parts.push(`${sg||''}${cnt}d${fc}[${rs.join(',')}]`)}
  else{const v=+c;total+=sg2==='-'?-v:v;parts.push((sg2||'+')+v)}return m});
 return {expr:s,total,detail:parts.join(' '),dice};
}

async function importDoc(f){
 const ext=(f.name.split('.').pop()||'').toLowerCase();const b=busy('Lendo '+f.name+'…');
 try{
  let html='';
  if(ext==='docx'){await loadScript(LIB.mammoth);const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});html=r.value}
  else if(ext==='md'||ext==='markdown'){await loadScript(LIB.marked);html=marked.parse(await f.text())}
  else if(ext==='html'||ext==='htm'){const d=new DOMParser().parseFromString(await f.text(),'text/html');html=d.body?d.body.innerHTML:''}
  else if(ext==='pdf'){html=await pdfToHtml(f,b)}
  else html=txtToHtml(await f.text());
  // imagens embutidas → armazenamento
  const d=document.createElement('div');d.innerHTML=clean(html);
  const imgs=$$('img',d).filter(i=>/^data:image\//.test(i.getAttribute('src')||''));
  for(let i=0;i<imgs.length;i++){b.set(`Guardando imagens (${i+1}/${imgs.length})…`);try{const blob=await (await fetch(imgs[i].src)).blob();const r=await storeImage(new File([blob],'imagem-'+(i+1)+'.png',{type:blob.type}));imgs[i].src=r.src;addToGallery(f.name.replace(/\.\w+$/,'')+' – img '+(i+1),r)}catch{imgs[i].remove()}}
  S.imp={name:f.name.replace(/\.\w+$/,''),html:d.innerHTML,mode:'auto'};renderImport();
 }catch(e){console.error(e);toast('Não consegui ler este arquivo: '+(e.message||e),'err')}finally{b.done()}
}
async function pdfToHtml(f,b){
 await loadScript(LIB.pdfjs);await loadScript(LIB.pdfw);
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
 const paras=[];
 for(let n=1;n<=pdf.numPages;n++){
  b.set(`Lendo página ${n} de ${pdf.numPages}…`);
  const pg=await pdf.getPage(n);const tc=await pg.getTextContent();
  const lines=[];let cur=null;
  tc.items.forEach(it=>{if(!('str' in it))return;const y=Math.round(it.transform[5]),h=Math.abs(it.transform[3])||10;
   if(!cur||Math.abs(cur.y-y)>h*.5){cur={y,h,t:''};lines.push(cur)}cur.t+=it.str;if(it.hasEOL)cur=null});
  const ls=lines.filter(l=>l.t.trim());const gaps=ls.slice(1).map((l,i)=>Math.abs(ls[i].y-l.y)).sort((a,b)=>a-b);const med=gaps[Math.floor(gaps.length/2)]||14;
  let buf='';ls.forEach((l,i)=>{const gap=i?Math.abs(ls[i-1].y-l.y):0;if(i&&gap>med*1.45&&buf){paras.push(buf.trim());buf=''}buf+=(buf&&!buf.endsWith('-')?' ':'')+l.t.trim();if(buf.endsWith('-'))buf=buf.slice(0,-1)});
  if(buf.trim())paras.push(buf.trim());
 }
 return paras.map(t=>'<p>'+esc(t)+'</p>').join('');
}
const CH_RE=/^\s*(cap[íi]tulo|chapter|parte|pr[óo]logo|ep[íi]logo|interl[úu]dio)\b.{0,70}$/i;
function splitChapters(html,mode,name){
 const d=document.createElement('div');d.innerHTML=html;const out=[];let cur=null;
 const isHead=el=>{const t=el.tagName;if(mode==='none')return false;if(t==='H1')return true;if(mode!=='h1'&&t==='H2')return true;if((t==='P'||t==='H3'||t==='H2')&&CH_RE.test(el.textContent)&&el.textContent.length<90)return true;return false};
 [...d.childNodes].forEach(n=>{
  if(n.nodeType===1&&isHead(n)){cur={title:n.textContent.trim().slice(0,120),html:''};out.push(cur);return}
  if(!cur){if(n.nodeType===3&&!n.textContent.trim())return;cur={title:out.length?'Sem título':name,html:''};out.push(cur)}
  cur.html+=n.nodeType===1?n.outerHTML:(n.textContent.trim()?'<p>'+esc(n.textContent)+'</p>':'');
 });
 return out.filter(c=>c.html.trim()||out.length===1);
}

function htmlToMd(html){

const SQ={};
function sharedWrite(path,op){
 const q=SQ[path]||(SQ[path]={run:false,op:null});
 if(op.patch&&q.op&&q.op.patch)q.op.patch=deepMerge(q.op.patch,op.patch);
 else if(op.patch&&q.op&&q.op.set)q.op.set=deepMerge(q.op.set,op.patch);
 else q.op=cl(op);
 if(!q.run)runShared(path);
}
async function runShared(path){
 const q=SQ[path];q.run=true;setStatus('saving');
 while(q.op){const op=q.op;q.op=null;const r=S.db.doc(path);
  try{if(op.set)await r.set(op.set);else if(op.patch)await r.update(op.patch);else if(op.del)await r.delete()}
  catch(e){console.warn('mesa',path,e);toast(e&&e.code==='invalid_argument'?'A mesa recusou essa alteração (sem permissão ou dado grande demais). Jogadores precisam de acesso de Colaborador.':e&&e.code==='resource_exhausted'?'Muitas alterações seguidas — aguarde um instante.':'Não foi possível salvar na mesa agora.','err');setStatus('err');q.run=false;return}}
 q.run=false;if(!Object.values(SQ).some(x=>x.run))setStatus('ok');
}

function ensureChoices(f){if(f.type!=='select')return[];if(!Array.isArray(f.choices)){f.choices=String(f.options||'').split(',').map(s=>s.trim()).filter(Boolean).map(n=>({id:uid(),name:n,desc:'',set:{},skills:[],items:[]}));delete f.options}if(f.pick===undefined)f.pick=true;return f.choices}
const choiceById=(f,v)=>v?ensureChoices(f).find(c=>c.id===v||c.name===v):null;

function applySet(tpl,v,set){const F=tplFields(tpl);for(const fid in set||{}){const f=F.find(x=>x.id===fid),raw=set[fid];if(!f||raw===''||raw===null||raw===undefined)continue;
 if(f.type==='bar'){const cur=fieldVal(f,v),max=Math.max(1,isRel(raw)?cur.max+numOf(raw):numOf(raw));v[fid]={cur:max,max}}
 else if(f.type==='number'||f.type==='attr'){const cur=+fieldVal(f,v)||0;v[fid]=isRel(raw)?cur+numOf(raw):numOf(raw)}
 else if(f.type==='check')v[fid]=raw===true||raw==='sim';
 else if(f.type!=='select')v[fid]=raw}}

 tplFields(tpl).filter(f=>f.type==='select').forEach(f=>{const c=choiceById(f,picks[f.id]);if(!c)return;v[f.id]=c.id;applySet(tpl,v,c.set);(c.skills||[]).forEach(s=>skills.add(s));(c.items||[]).forEach(it=>inv.push({k:uid(),item:it.item,qty:it.qty||1}))});
 return{values:v,skills:[...skills],inv}}
function choiceSummary(tpl,c){const F=tplFields(tpl);const parts=Object.entries(c.set||{}).filter(([,v])=>v!==''&&v!=null).map(([fid,v])=>{const f=F.find(x=>x.id===fid);if(!f)return'';return `${f.label} ${f.type==='bar'?(isRel(v)?v:'máx '+v):(v===true?'✓':v)}`}).filter(Boolean);
 const sk=(c.skills||[]).map(id=>(T.game.skills||[]).find(s=>s.id===id)).filter(Boolean).map(s=>(s.icon||'✨')+' '+s.name);
 const it=(c.items||[]).map(e=>{const i=itemById(e.item);return i?(i.icon||'🎒')+' '+i.name+(e.qty>1?' ×'+e.qty:''):''}).filter(Boolean);
 return[...parts,...sk,...it]}
function fieldHTML(f,vals,opt){
 const ro=opt.ro||(f.master&&!opt.canMaster&&f.type==='bar'),dis=ro?'disabled':'',v=fieldVal(f,vals),lab=`<label>${esc(f.label)}</label>`;
 switch(f.type){
  case'bar':{const pct=v.max?clamp(v.cur/v.max*100,0,100):0;return `<div class="sf sf-bar" data-fid="${f.id}">${lab}<div class="sbar big"><i style="width:${pct}%"></i><em>${v.cur} / ${v.max}</em></div>${ro?'':`<div class="row"><input type="number" data-f="${f.id}" data-p="cur" value="${v.cur}"><span class="muted">/</span><input type="number" data-f="${f.id}" data-p="max" value="${v.max}"></div>`}</div>`}

 }

  <label class="f">Apelido público (aparece como autor nas publicações e na mesa)</label><input id="acN" value="${esc(p.nick)}" maxlength="40" placeholder="${esc(S.me&&S.me.name||'Seu nome de autor')}">
  <label class="f">Ícone</label>${tokenPickerHTML(o.emoji,o.color)}
  <label class="f">Sobre você</label><textarea id="acB" rows="2" placeholder="Escritor de fantasia, mestre de RPG às sextas…">${esc(p.bio)}</textarea>
  <h3 style="margin:18px 0 4px;font:600 16px var(--disp)">🔒 Senha do aplicativo</h3><p class="small muted" style="margin:0 0 8px">${S.prefs.lock?'Ativa: o app pede a senha sempre que é aberto numa nova aba ou aparelho.':'Desativada. Com senha, o app pede a senha ao ser aberto — útil em aparelhos compartilhados.'}</p>
  <div class="row wrap"><button class="btn" data-v="pw">${S.prefs.lock?'Trocar senha':'Criar senha'}</button>${S.prefs.lock?'<button class="btn ghost danger" data-v="rmpw">Remover senha</button><button class="btn ghost" data-v="lock">Bloquear agora</button>':''}</div>`,
  onMount:(ov,close)=>{bindTokenPicker(ov,o);$$('[data-v]',ov).forEach(b=>b.onclick=()=>{ov._save();close(b.dataset.v)});ov._save=()=>{p.nick=$('#acN',ov).value.trim();p.bio=$('#acB',ov).value.trim();p.emoji=o.emoji;p.color=o.color;savePrefs()}},
  actions:[{label:'Fechar'},{label:'Salvar',cls:'primary',onClick:ov=>{ov._save();toast('Conta atualizada');return 'ok'}}]});
 if(v==='pw')return setPassword();
 if(v==='rmpw'){if(await confirmDlg('Remover a senha do aplicativo?','Remover')){S.prefs.lock=null;savePrefs();toast('Senha removida')}}
 if(v==='lock'){markUnlocked(false);closeTable();renderLock();return}
 if(!S.P&&!T.gid&&$('.home'))renderHome();
};
async function setPassword(){
 const v=await modal({title:'Senha do aplicativo',body:`<label class="f">Nova senha (mínimo 4 caracteres)</label><input type="password" id="pw1" autocomplete="new-password"><label class="f">Repita a senha</label><input type="password" id="pw2" autocomplete="new-password"><p class="small muted">Guarde bem: se esquecer, dá para redefinir pela sua conta do claude.ai, mas a trava existe para que outra pessoa no mesmo aparelho não abra seus projetos sem querer.</p>`,
  actions:[{label:'Cancelar'},{label:'Salvar senha',cls:'primary',onClick:ov=>{const a=$('#pw1',ov).value,b=$('#pw2',ov).value;if(a.length<4){toast('Use pelo menos 4 caracteres.','err');return false}if(a!==b){toast('As senhas não conferem.','err');return false}return a}}]});
 if(!v)return;const salt=uid()+uid();S.prefs.lock={salt,hash:await sha(salt+v)};savePrefs();markUnlocked(true);toast('Senha criada');if($('.home'))renderHome();
}
function renderLock(){
 const p=prof();$('#app').innerHTML=`<div class="lockscr"><div class="card lockcard"><img class="lock-logo" src="img/logo.webp" alt="Inkmind">
  <span class="tok big" style="background:${esc(p.color)};margin:0 auto">${esc(p.emoji)}</span><h3 style="text-align:center;margin:12px 0 2px">Olá, ${esc(myName())}</h3><p class="muted small" style="text-align:center;margin:0 0 14px">Digite a senha do aplicativo para continuar.</p>
  <form id="lkF"><input type="password" id="lkP" placeholder="Senha" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:10px;padding:12px">Entrar</button></form>
  <button class="btn ghost sm" id="lkForgot" style="width:100%;margin-top:8px">Esqueci a senha</button></div></div>`;
 setTimeout(()=>$('#lkP')&&$('#lkP').focus(),50);
 $('#lkF').onsubmit=async e=>{e.preventDefault();const L=S.prefs.lock;if(!L){markUnlocked(true);return renderHome()}if(await sha(L.salt+$('#lkP').value)===L.hash){markUnlocked(true);renderHome()}else{toast('Senha incorreta.','err');$('#lkP').select()}};
 $('#lkForgot').onclick=async()=>{if(await confirmDlg('Redefinir a senha? Como você já está na sua conta do claude.ai, a senha antiga será removida e você pode criar outra em “Minha conta”.','Redefinir')){S.prefs.lock=null;savePrefs();markUnlocked(true);renderHome();toast('Senha removida — crie uma nova em Minha conta')}};
}

/* ============ gerador de imagens externo (site ou chat de IA) ============ */
const IMG_STYLES=['fantasia sombria','pintura a óleo','aquarela','retrato de personagem','mapa visto de cima','ícone de token redondo','capa de livro','pixel art'];
async function genImage(){
 let result=null,onPaste=null;
 await modal({title:'🎨 Gerar imagem com IA',wide:true,body:`
  <div id="giCfg" class="card" style="display:${(S.prefs.imageGen||{}).url?'none':'block'};margin-bottom:12px"><h3>Seu gerador de imagens</h3><p class="small muted" style="margin:0 0 6px">Cole o endereço do site ou chat de IA que você usa para criar imagens. Se o site aceitar a descrição no endereço, escreva <code>{prompt}</code> no lugar dela.</p>
   <div class="row wrap"><input id="giU" placeholder="https://seu-gerador.com/criar?q={prompt}" value="${esc((S.prefs.imageGen||{}).url||'')}" style="flex:2;min-width:220px"><input id="giN" placeholder="Nome (ex.: Meu gerador)" value="${esc((S.prefs.imageGen||{}).name||'')}" style="flex:1;min-width:140px"><button class="btn primary" id="giSave">Salvar</button></div></div>
  <label class="f" style="margin-top:0">Descreva a imagem</label><textarea id="giP" rows="3" placeholder="Ex.: retrato de uma elfa arqueira de capa verde, floresta sombria ao fundo, luz de tochas"></textarea>
  <div class="chips" style="margin:8px 0">${IMG_STYLES.map(s=>`<button class="chip" data-st="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div>
  <div class="row wrap">${S.sample?'<button class="btn" id="giAI">✨ Melhorar descrição com IA</button>':''}<span class="sp"></span><button class="btn ghost sm" id="giCfgB">⚙ Endereço do gerador</button><a class="btn primary" id="giGo" target="_blank" rel="noopener noreferrer" href="#">Abrir gerador ↗</a></div>
  <p class="small muted">O gerador abre numa nova aba (sites externos não podem rodar dentro do app) e a descrição é copiada. Quando a imagem ficar pronta, copie ou baixe e traga de volta:</p>
  <div class="drop" id="giDrop"><b>Cole a imagem aqui (Ctrl+V / colar)</b><br>ou toque para escolher o arquivo baixado</div>`,
  onMount:(ov,close)=>{
   const P_=$('#giP',ov),go=$('#giGo',ov);
   const upd=()=>{const c=S.prefs.imageGen||{},u=(c.url||'').trim(),q=P_.value.trim();go.href=u?(u.includes('{prompt}')?u.split('{prompt}').join(encodeURIComponent(q)):u):'#';go.textContent='Abrir '+(c.name||'gerador')+' ↗';go.classList.toggle('disabled',!u)};
   P_.oninput=upd;$$('[data-st]',ov).forEach(b=>b.onclick=()=>{P_.value=(P_.value.trim()?P_.value.trim()+', ':'')+b.dataset.st;upd()});
   $('#giCfgB',ov).onclick=()=>{const c=$('#giCfg',ov);c.style.display=c.style.display==='none'?'block':'none'};
   $('#giSave',ov).onclick=()=>{const u=$('#giU',ov).value.trim();if(!/^https?:\/\//i.test(u)){toast('O endereço precisa começar com https://','err');return}S.prefs.imageGen={url:u,name:$('#giN',ov).value.trim()};savePrefs();$('#giCfg',ov).style.display='none';upd();toast('Gerador salvo')};
   go.onclick=e=>{if(!(S.prefs.imageGen||{}).url){e.preventDefault();$('#giCfg',ov).style.display='block';toast('Configure o endereço do gerador primeiro.');return}const q=P_.value.trim();if(q)try{navigator.clipboard.writeText(q).then(()=>toast('Descrição copiada — cole no gerador se precisar'),()=>{})}catch{}};
   const ai=$('#giAI',ov);if(ai)ai.onclick=async()=>{const q=P_.value.trim();if(!q){toast('Escreva uma ideia primeiro.');return}ai.disabled=true;ai.textContent='✨ Escrevendo…';
    try{const r=await S.sample(`Você escreve prompts para geradores de imagem por IA. Transforme a ideia abaixo em UM prompt em inglês, rico em detalhes visuais (assunto, estilo artístico, iluminação, composição, paleta), com no máximo 70 palavras. Responda apenas com o prompt, sem aspas nem comentários.\n\nIdeia: ${q}`,{modelTier:'quick'});if(r&&r.text){P_.value=r.text.trim();upd()}}
    catch(e){toast(e&&e.code==='rate_limited'?'Muitos pedidos — tente em instantes.':'Não consegui melhorar agora.','err')}finally{ai.disabled=false;ai.textContent='✨ Melhorar descrição com IA'}};
   const take=async f=>{const b=busy('Guardando imagem…');try{const r=await storeImage(f);if(P())addToGallery((P_.value.trim()||'Imagem gerada').slice(0,40),r);result=r;toast('Imagem adicionada'+(P()?' à galeria':''));close('ok')}catch(er){toast(er.message||'Falha ao guardar','err')}finally{b.done()}};
   bindDrop($('#giDrop',ov),'image/*',false,fs=>take(fs[0]));
   onPaste=e=>{const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();take(f)}};document.addEventListener('paste',onPaste);
   upd();},
  actions:[{label:'Fechar'}]});
 if(onPaste)document.removeEventListener('paste',onPaste);
 return result;
}
ACT.genImg=async()=>{const r=await genImage();if(r&&S.P&&S.view==='gallery')RENDER.gallery()};

/* ============ publicar e biblioteca ============ */
async function publishProject(){
 const p=P();if(S.backend!=='cloud'||!S.uid){toast('Publicar só funciona '+CLOUD_NEED()+'.','err');return}
 await flushChapter();ensureOutline(p);const b=busy('Publicando…');
 try{
  const base='pubs/'+S.uid,bp=base+'/books/'+p.id;const order=bookOrder();const toc=[];let lastF=null,words=0;
  let prev=[];try{const ps=await S.db.doc(bp).get();if(ps.exists)prev=(ps.data().toc||[]).map(t=>t.id)}catch{}
  for(let i=0;i<order.length;i++){const o=order[i],c=cm(o.id);b.set(`Publicando capítulo ${i+1} de ${order.length}…`);const d=await getChapter(o.id);const html=clean(d.html||'');
   const fid=o.folder?o.folder.id:null;toc.push({id:o.id,title:c.title||'Sem título',part:fid&&fid!==lastF?o.folder.title:null});lastF=fid;words+=c.words||0;
   try{await S.db.doc(bp+'/ch/'+o.id).set({title:c.title||'',html,n:i+1})}catch(e){if(e&&e.code==='invalid_argument')throw new Error(`O capítulo “${c.title}” é grande demais para publicar (limite ~250 KB). Divida-o em dois.`);throw e}}
  for(const id of prev)if(!toc.some(t=>t.id===id))await S.db.doc(bp+'/ch/'+id).delete().catch(()=>{});
  const s=p.settings;const author=p.author||myName();
  await S.db.doc(bp).set({id:p.id,kind:p.type==='rpg'?'rpg':'book',title:p.title,author,synopsis:p.synopsis||'',cover:p.cover||null,genre:p.genre||'',settings:{bodyFont:s.bodyFont,headFont:s.headFont,fontSize:s.fontSize,lineHeight:s.lineHeight,paraStyle:s.paraStyle,align:s.align,dropcap:s.dropcap},toc,updatedAt:Date.now()});
  const sum={id:p.id,kind:p.type==='rpg'?'rpg':'book',title:p.title,author,genre:p.genre||'',synopsis:(p.synopsis||'').slice(0,400),cover:p.cover||null,chapters:toc.length,words,updatedAt:Date.now()};
  const idx=S.db.doc(base),is=await idx.get();if(is.exists)await idx.update({items:{[p.id]:sum}});else await idx.set({uid:S.uid,items:{[p.id]:sum}});
  if(p.type==='rpg'){const gr=S.db.doc('games/'+p.id);try{const gs=await gr.get();if(gs.exists)await gr.update({published:true,title:p.title,synopsis:p.synopsis||'',cover:p.cover||null,genre:p.genre||''});else await gr.set({kind:'game',id:p.id,title:p.title,masterId:S.uid,createdAt:Date.now(),template:presetTpl('classico'),chars:[],skills:[],items:[],activeMap:null,mrolls:[],published:true,synopsis:p.synopsis||'',cover:p.cover||null,genre:p.genre||''})}catch(e){toast('O livro foi publicado, mas a mesa de jogo precisa do dono do app para ser aberta ao público.','err')}}
  p.published={at:Date.now()};saveProject();toast(p.type==='rpg'?'Campanha publicada! Ela aparece na busca de RPG.':'Livro publicado na Biblioteca!');
 }catch(e){console.warn(e);toast(e.message||'Não foi possível publicar agora.','err')}finally{b.done()}
}
async function unpublishProject(p,silent){
 if(S.backend!=='cloud')return;const base='pubs/'+S.uid,bp=base+'/books/'+p.id;
 try{const ps=await S.db.doc(bp).get();if(ps.exists){for(const t of ps.data().toc||[])await S.db.doc(bp+'/ch/'+t.id).delete().catch(()=>{});await S.db.doc(bp).delete()}
  const idx=await S.db.doc(base).get();if(idx.exists)await S.db.doc(base).update({items:{[p.id]:null}});
  if(p.type==='rpg')await S.db.doc('games/'+p.id).update({published:false}).catch(()=>{});
  p.published=null;if(S.P&&S.P.id===p.id)saveProject();if(!silent)toast('Publicação removida')}catch(e){console.warn(e);if(!silent)toast('Não consegui despublicar agora.','err')}
}
ACT.pubDo=async()=>{await publishProject();RENDER.export()};
ACT.pubUndo=async()=>{if(!await confirmDlg('Tirar este projeto da Biblioteca? Ele continua na sua estante.','Despublicar'))return;await unpublishProject(P());RENDER.export()};
ACT.explore=async()=>{if(S.P){await flushChapter();saveProject.flush()}closeTable();T.gid=null;renderExplore()};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
async function renderExplore(){
 S.P=null;S.cid=null;document.body.classList.remove('focus');S.exK=S.exK||'all';
 $('#app').innerHTML=`<div class="home"><header class="home-h"><button class="btn ghost sm" data-act="home">${I('back')}<span class="hide-m">Estante</span></button><div class="brand" style="font-size:19px"><img class="brand-mark" src="img/mark.webp" alt="">Biblioteca</div><div class="sp"></div>${accountChip()}</header>
  <section class="hero"><h1>Explorar</h1><p>Livros e campanhas de RPG publicados no Inkmind.</p>
  <div class="row wrap"><input id="exq" placeholder="🔎 Buscar por título, autor ou gênero…" style="max-width:440px" value="${esc(S.exQ||'')}"><div class="seg" id="exK">${[['all','Todos'],['book','📖 Livros'],['rpg','🎲 RPG']].map(([k,l])=>`<button data-k="${k}" class="${S.exK===k?'on':''}">${l}</button>`).join('')}</div></div></section>
  <div class="shelf" id="exList"><div class="empty" style="grid-column:1/-1"><div class="spin" style="margin:0 auto 10px"></div>Carregando publicações…</div></div></div>`;
 $('#exq').oninput=debounce(()=>{S.exQ=$('#exq').value;drawExplore()},200);
 $$('#exK button').forEach(b=>b.onclick=()=>{S.exK=b.dataset.k;$$('#exK button').forEach(x=>x.classList.toggle('on',x===b));drawExplore()});
 if(S.backend!=='cloud'){$('#exList').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">Biblioteca indisponível</div><p>${FBAVAIL()?'<a href="#" data-act="inkLogin">Entre na sua conta do Inkmind</a>':'Abra o app no claude.ai'} para ver e publicar livros e RPGs.</p></div>`;return}
 try{const snap=await withTimeout(S.db.collection('pubs').get(),15000);const items=[];snap.docs.forEach(d=>{const it=(d.data()||{}).items||{};for(const k in it)if(it[k])items.push({...it[k],owner:d.id})});S.pubs=items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
 catch(e){console.warn(e);S.pubs=[]}
 drawExplore();
}
function drawExplore(){const box=$('#exList');if(!box||!S.pubs)return;const q=norm(S.exQ),k=S.exK;
 const L=S.pubs.filter(p=>(k==='all'||p.kind===k)&&(!q||norm(p.title+' '+p.author+' '+p.genre+' '+p.synopsis).includes(q)));
 box.innerHTML=L.length?L.map(p=>`<div class="book" data-act="pubOpen" data-o="${esc(p.owner)}" data-id="${esc(p.id)}">
   <div class="cover ${p.cover?'hasimg':''}" style="${coverStyle(p)}">${p.cover?`<img src="${esc(p.cover)}" alt="">`:''}<div class="ct">${esc(p.title)}</div><div class="ca">${esc(p.author||'')}</div></div>
   <div class="book-meta"><b>${esc(p.title)}</b><span class="pill">${p.kind==='rpg'?'🎲 RPG':'📖 Livro'}</span>${p.genre?`<span class="pill">${esc(p.genre)}</span>`:''}${p.kind==='rpg'?`<span class="pill mo" data-mo="${esc(p.id)}" data-mid="${esc(p.owner)}"></span>`:`<span class="pill">${p.chapters||0} cap.</span>`}${p.owner===S.uid?'<span class="pill">seu</span>':''}</div></div>`).join('')
  :`<div class="empty" style="grid-column:1/-1"><div class="big">${S.pubs.length?'Nada encontrado':'Nada publicado ainda'}</div><p>${S.pubs.length?'Tente outra busca.':'Publique um livro ou campanha em Exportar → Publicar.'}</p></div>`;
 onPeersChange();
}
ACT.pubOpen=async el=>{const p=(S.pubs||[]).find(x=>x.owner===el.dataset.o&&x.id===el.dataset.id);if(!p)return;const on=p.kind==='rpg'?masterOnline(p.id,p.owner):null;
 const v=await modal({title:esc(p.title),wide:true,body:`<div class="row" style="align-items:flex-start;gap:16px;flex-wrap:wrap"><div style="width:130px;flex:none"><div class="cover ${p.cover?'hasimg':''}" style="${coverStyle(p)};padding:10px">${p.cover?`<img src="${esc(p.cover)}" alt="">`:''}<div class="ct" style="font-size:14px">${esc(p.title)}</div></div></div>
  <div class="grow" style="min-width:200px"><p style="margin:0 0 6px"><b>${esc(p.author||'Autor desconhecido')}</b></p><div class="row wrap" style="gap:6px;margin-bottom:8px"><span class="pill">${p.kind==='rpg'?'🎲 Campanha de RPG':'📖 Livro'}</span>${p.genre?`<span class="pill">${esc(p.genre)}</span>`:''}<span class="pill">${p.chapters||0} ${p.kind==='rpg'?'seções':'capítulos'}</span><span class="pill">${fmtK(p.words||0)} palavras</span></div>
  <p class="muted">${esc(p.synopsis||'Sem sinopse.')}</p>${p.kind==='rpg'?`<div class="mstat ${on?'on':''}"><span class="d"></span>${on===null?'Status do mestre indisponível':on?'Mestre conectado agora':'Mestre offline — você poderá entrar quando ele se conectar'}</div>`:''}</div></div>`,
  actions:[{label:'Fechar'},{label:'📖 Ler',cls:p.kind==='rpg'?'':'primary',value:'read'},...(p.kind==='rpg'?[{label:'🎲 Ir para a mesa',cls:'primary',value:'play'}]:[])]});
 if(v==='read')renderReader(p.owner,p.id,0);if(v==='play')openTable(p.id,{fromExplore:true})};
const RD={};
async function renderReader(owner,pid,idx){
 const b=busy('Abrindo…');let book=null;try{const s=await S.db.doc(`pubs/${owner}/books/${pid}`).get();book=s.exists?s.data():null}catch{}finally{b.done()}
 if(!book){toast('Esta publicação não está mais disponível.','err');return}
 Object.assign(RD,{owner,pid,book,idx:idx||0});const s=book.settings||{};[s.bodyFont,s.headFont].forEach(f=>f&&loadFont(f));
 $('#app').innerHTML=`<div class="reader"><header class="home-h"><button class="btn ghost sm" data-act="explore">${I('back')}<span class="hide-m">Biblioteca</span></button><div class="grow" style="min-width:0"><b class="rd-h">${esc(book.title)}</b><small class="muted">${esc(book.author||'')}</small></div><select id="rdCh" style="width:auto;max-width:46vw">${(book.toc||[]).map((c,i)=>`<option value="${i}">${c.part?esc(c.part)+' · ':''}${i+1}. ${esc(c.title)}</option>`).join('')}</select></header>
  <div class="rd-scroll" id="rdScroll"><article class="paper rd-paper" id="rdPaper"><div class="ch-kicker" id="rdK"></div><h1 class="rd-title" id="rdT"></h1><div class="prose" id="rdBody"></div>
  <div class="rd-nav"><button class="btn" id="rdPrev">← Anterior</button><button class="btn primary" id="rdNext">Próximo →</button></div></article></div></div>`;
 const paper=$('#rdPaper');paper.style.setProperty('--bf',fontStack(s.bodyFont||'Literata'));paper.style.setProperty('--hf',fontStack(s.headFont||'Playfair Display'));paper.style.setProperty('--fs',(s.fontSize||18)+'px');paper.style.setProperty('--lh',s.lineHeight||1.7);paper.style.setProperty('--align',s.align||'justify');
 $('#rdBody').classList.toggle('web',s.paraStyle==='web');$('#rdBody').classList.toggle('dropcap',!!s.dropcap);
 $('#rdCh').onchange=e=>showReaderCh(+e.target.value);$('#rdPrev').onclick=()=>showReaderCh(RD.idx-1);$('#rdNext').onclick=()=>showReaderCh(RD.idx+1);
 showReaderCh(RD.idx);
}
